openapi: 3.1.0
info:
  title: Warranty AI Platform API (PoC)
  version: 0.1.0
  description: |
    REST API for the multi-tenant warranty claim adjudication PoC.

    Tenant resolution (never from request bodies or query strings):
    - Public claimant endpoints (`/api/public/...`): tenant from the request Host via the server-side
      channel registry (e.g. `aurora.localhost`).
    - Staff endpoints (`/api/...`): tenant from the `tenant_id` claim of the OIDC access token.

    Resources of another tenant are reported as `404` (never `403`) and recorded as security events.
    Errors use RFC 9457 Problem Details. Every response carries `X-Correlation-Id`.
servers:
  - url: https://localhost:7443
    description: Local API (Aspire)
tags:
  - name: Public
    description: Claimant channel (no account; tenant from Host)
  - name: Claims
  - name: Review
  - name: Trace
  - name: Reference
security:
  - staffOidc: []

paths:
  /api/public/tenant:
    get:
      tags: [Public]
      summary: Branding info for the tenant resolved from the Host
      security: []
      responses:
        '200':
          description: Tenant resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicTenantInfo' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/public/claims:
    post:
      tags: [Public]
      summary: Submit a claim through the tenant's claimant channel (FR-007)
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ClaimSubmissionForm' }
      responses:
        '202':
          description: Accepted; adjudication runs asynchronously
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/public/claims/access:
    post:
      tags: [Public]
      summary: Exchange claim reference + submitted contact for a claim-scoped token (FR-037a)
      description: >
        Returns the same 401 for unknown references and non-matching contacts. Failed attempts are
        recorded as security events. Rate-limited per IP and reference.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimantAccessRequest' }
      responses:
        '200':
          description: Access granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimantAccessToken' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/public/claims/{reference}:
    get:
      tags: [Public]
      summary: Claimant view of a claim (status, outcome explanation, requested items)
      security:
        - claimantToken: []
      parameters:
        - $ref: '#/components/parameters/Reference'
      responses:
        '200':
          description: Claim status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimantClaimView' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/public/claims/{reference}/supplements:
    post:
      tags: [Public]
      summary: Supplement a claim that is Pending Information (FR-010)
      security:
        - claimantToken: []
      parameters:
        - $ref: '#/components/parameters/Reference'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SupplementForm' }
      responses:
        '202':
          description: Accepted; a new evaluation round starts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/me:
    get:
      tags: [Reference]
      summary: Current staff user (tenant and roles from the token)
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: The caller's tenant is no longer active
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  /api/claims:
    get:
      tags: [Claims]
      summary: List claims of the caller's tenant
      description: Roles claims-agent, claims-reviewer, auditor.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ClaimStatus' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Page of claims
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimPage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
    post:
      tags: [Claims]
      summary: Claims agent submits a claim on a customer's behalf (FR-007)
      description: Role claims-agent. Tenant comes from the agent's token.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ClaimSubmissionForm' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }

  /api/claims/{claimId}:
    get:
      tags: [Claims]
      summary: Full staff view of a claim and its latest evaluation (FR-033)
      description: >
        Roles claims-agent, claims-reviewer, auditor. For role claims-agent,
        latestEvaluation.risk, latestEvaluation.recommendation.reasoningSummary,
        latestEvaluation.guardrails.checks and reviewDecisions[].justification are omitted, and
        risk-related guardrails.reasons (RISK_MEDIUM, RISK_HIGH, EVIDENCE_CONFLICT,
        AI_DETERMINISTIC_DISAGREEMENT, UNSAFE_CLAIMANT_TEXT) are replaced by a single
        "Additional checks required" (FR-005).
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Claim detail
          headers:
            ETag:
              description: Row version, required as If-Match for review decisions
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/claims/{claimId}/supplements:
    post:
      tags: [Claims]
      summary: Claims agent supplements a Pending Information claim
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SupplementForm' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/claims/{claimId}/evidence/{evidenceId}/content:
    get:
      tags: [Claims]
      summary: Stream an evidence file after authorization and tenant check
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: evidenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: File content
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
            application/pdf: {}
        '404': { $ref: '#/components/responses/NotFound' }

  /api/review-queue:
    get:
      tags: [Review]
      summary: Escalated claims of the reviewer's tenant (FR-032)
      description: Role claims-reviewer.
      responses:
        '200':
          description: Review queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReviewQueueItem' }

  /api/claims/{claimId}/review-decisions:
    post:
      tags: [Review]
      summary: Record a reviewer decision (FR-034 – FR-036)
      description: >
        Role claims-reviewer. Allowed only when status is UnderReview. Justification (internal,
        never shown to the claimant) is required when the decision differs from a valid APPROVE or
        REJECT recommendation, or is Reject. claimantExplanation is required for Approve and Reject, must be
        absent for RequestInformation, and becomes the claimant's outcome explanation; it is
        rejected with 400 when it contains risk/fraud terms or reference IDs (FR-036, FR-037).
        A RequestInformation decision marks the claim so that, after the supplement, it is
        re-evaluated and returns to this queue instead of being finalized automatically (FR-034).
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecisionRequest' }
      responses:
        '201':
          description: Decision recorded; claim updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewDecision' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '403':
          description: >
            The reviewer submitted this claim and may not decide it (separation of duties); a
            SELF_REVIEW_REFUSED security event is recorded and nothing changes.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Problem' }

  /api/claims/{claimId}/trace:
    get:
      tags: [Trace]
      summary: Chronological decision trail with AI execution steps (FR-038 – FR-041)
      description: Roles claims-reviewer, auditor.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Decision trace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionTrace' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/security-events:
    get:
      tags: [Audit]
      summary: Security events of the caller's tenant, newest first (FR-041a)
      description: >
        Role auditor. Returns only events attributed to the caller's tenant; never returns event
        details or source IP addresses, and never reveals whether a target belongs to another
        tenant (cross-tenant attempts appear as ACCESS_DENIED, identical to unknown IDs).
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/SecurityEventKind' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Page of security events
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityEventPage' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '403': { $ref: '#/components/responses/Problem' }

  /api/policies:
    get:
      tags: [Reference]
      summary: Policy versions of the caller's tenant (read-only)
      responses:
        '200':
          description: Policy versions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PolicyVersionSummary' }

components:
  securitySchemes:
    staffOidc:
      type: oauth2
      description: Keycloak, Authorization Code + PKCE. Token carries tenant_id and realm roles.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/warranty/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/warranty/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect
    claimantToken:
      type: http
      scheme: bearer
      description: Claim-scoped token issued by POST /api/public/claims/access (30 minutes).

  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Reference:
      name: reference
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{10}$' }

  responses:
    Problem:
      description: Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationProblem:
      description: Validation errors
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblemDetails' }
    NotFound:
      description: Not found (also returned for other tenants' resources)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: State conflict (e.g. claim not in the required status, concurrent decision)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ClaimStatus:
      type: string
      enum: [Submitted, UnderEvaluation, PendingInformation, UnderReview, Approved, Rejected]
    Region:
      type: string
      enum: [NA, EU]
    Disposition:
      type: string
      enum: [AutoApprove, AutoReject, RequestInformation, HumanReview]
    AiDecision:
      type: string
      enum: [APPROVE, REJECT, REQUEST_MORE_INFORMATION, HUMAN_REVIEW]

    SecurityEventKind:
      type: string
      description: Tenant-visible kinds only; operator-only kinds (CROSS_TENANT_ACCESS_DENIED, UNKNOWN_CHANNEL) are never returned
      enum: [ACCESS_DENIED, CLAIMANT_ACCESS_FAILED, RETRIEVAL_SCOPE_VIOLATION, TOOL_SCOPE_VIOLATION, SELF_REVIEW_REFUSED]

    SecurityEvent:
      type: object
      required: [id, occurredAt, kind, actor]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        kind: { $ref: '#/components/schemas/SecurityEventKind' }
        actor: { type: string, description: Staff display name, "claimant channel", or "adjudication-service" }
        target: { type: string, description: The resource identifier as the actor supplied it }

    SecurityEventPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SecurityEvent' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    PublicTenantInfo:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }

    ClaimSubmissionForm:
      type: object
      required: [claim, invoice, photos]
      properties:
        claim:
          $ref: '#/components/schemas/ClaimSubmissionData'
        invoice:
          type: string
          format: binary
          description: PDF or image, max 15 MB
        photos:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, format: binary }
      description: >
        Multipart: part `claim` is JSON (application/json). The body contains no tenant field;
        any tenant-like field is ignored.

    ClaimSubmissionData:
      type: object
      required: [customer, product, purchase, problemDescription]
      additionalProperties: false
      properties:
        customer:
          type: object
          required: [fullName, email, country]
          additionalProperties: false
          properties:
            fullName: { type: string, maxLength: 200 }
            email: { type: string, format: email }
            phone: { type: string, maxLength: 30 }
            addressLine: { type: string, maxLength: 200 }
            city: { type: string, maxLength: 100 }
            postalCode: { type: string, maxLength: 20 }
            country: { type: string, pattern: '^[A-Z]{2}$' }
        product:
          type: object
          required: [modelCode, serialNumber]
          additionalProperties: false
          properties:
            modelCode: { type: string, maxLength: 50 }
            serialNumber: { type: string, maxLength: 50 }
        purchase:
          type: object
          required: [date, place, price, currency, country]
          additionalProperties: false
          properties:
            date:
              type: string
              format: date
              description: Not in the future and not after the submission date; otherwise 400 (FR-009)
            place: { type: string, maxLength: 200 }
            price: { type: number, exclusiveMinimum: 0 }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
            country: { type: string, pattern: '^[A-Z]{2}$' }
        problemDescription: { type: string, minLength: 20, maxLength: 4000 }

    SupplementForm:
      type: object
      properties:
        note: { type: string, maxLength: 2000 }
        invoice: { type: string, format: binary }
        photos:
          type: array
          maxItems: 8
          items: { type: string, format: binary }

    SubmissionAccepted:
      type: object
      required: [reference, status, round]
      properties:
        claimId: { type: string, format: uuid, description: Staff responses only }
        reference: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        round: { type: integer }

    ClaimantAccessRequest:
      type: object
      required: [reference, contact]
      additionalProperties: false
      properties:
        reference: { type: string }
        contact: { type: string, description: Email address or phone number given at submission }

    ClaimantAccessToken:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }

    ClaimantClaimView:
      type: object
      required: [reference, status, submittedAt, requestedItems]
      description: No risk signals, fraud indicators or internal reasoning (FR-037).
      properties:
        reference: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        submittedAt: { type: string, format: date-time }
        productName: { type: string }
        outcomeExplanation:
          type: string
          description: >
            Present when Approved or Rejected: the AI's claimant explanation for automatic
            decisions, or the reviewer's claimantExplanation for reviewer decisions. Never the
            reviewer's justification.
        requestedItems:
          type: array
          description: What the claimant is asked to supply; empty unless Pending Information
          items: { $ref: '#/components/schemas/RequestedItem' }

    RequestedItem:
      type: object
      required: [item, reason]
      properties:
        item: { type: string }
        reason: { type: string }

    Me:
      type: object
      required: [sub, name, tenantDisplayName, tenantCurrency, roles]
      properties:
        sub: { type: string }
        name: { type: string }
        tenantDisplayName: { type: string }
        tenantCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 code from tenant settings; the currency of every claim value
        roles:
          type: array
          items: { type: string, enum: [claims-agent, claims-reviewer, auditor] }

    ClaimSummary:
      type: object
      required: [claimId, reference, status, productName, submittedAt]
      properties:
        claimId: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        productName: { type: string }
        submittedAt: { type: string, format: date-time }
        aiDecision: { $ref: '#/components/schemas/AiDecision' }
        disposition: { $ref: '#/components/schemas/Disposition' }

    ClaimPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ClaimSummary' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }

    ClaimDetail:
      type: object
      required:
        - claimId
        - reference
        - status
        - channel
        - claimDate
        - customer
        - product
        - purchase
        - problemDescription
        - evidence
        - reviewDecisions
        - requestedItems
        - autoInfoRequestCount
        - reviewerInfoRequested
      description: Optional members are omitted from the JSON (never null) when absent or hidden from the caller's role.
      properties:
        claimId: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        channel: { type: string, enum: [ClaimantPortal, AgentPortal] }
        claimDate: { type: string, format: date }
        region: { $ref: '#/components/schemas/Region' }
        customer:
          type: object
          properties:
            fullName: { type: string }
            email: { type: string }
            country: { type: string }
        product:
          type: object
          required: [modelCode, serialNumber, inCatalog]
          description: name, category and claimValue only when the product is in the tenant's catalog
          properties:
            modelCode: { type: string }
            serialNumber: { type: string }
            name: { type: string }
            category: { type: string }
            inCatalog: { type: boolean }
            claimValue: { type: number }
        purchase:
          type: object
          required: [date, place, price, currency]
          properties:
            date: { type: string, format: date }
            place: { type: string }
            price: { type: number }
            currency: { type: string, description: The tenant's currency (ISO 4217) }
        problemDescription: { type: string }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceItem' }
        latestEvaluation: { $ref: '#/components/schemas/Evaluation' }
        reviewDecisions:
          type: array
          items: { $ref: '#/components/schemas/ReviewDecision' }
        finalOutcome: { type: string, enum: [Approved, Rejected] }
        finalDecidedBy: { type: string, enum: [System, Reviewer] }
        finalExplanation: { type: string, description: Claimant-facing explanation shown for the final outcome }
        requestedItems:
          type: array
          description: Items requested from the claimant by the latest information request (FR-010, FR-029)
          items: { $ref: '#/components/schemas/RequestedItem' }
        autoInfoRequestCount:
          type: integer
          minimum: 0
          maximum: 2
          description: Automatic requests for more information made so far (limit 2, FR-010)
        reviewerInfoRequested:
          type: boolean
          description: A reviewer has requested more information; later rounds always return to review (FR-034)

    EvidenceItem:
      type: object
      required: [evidenceId, kind, fileName, contentType, round]
      properties:
        evidenceId: { type: string, format: uuid }
        ref: { type: string, description: 'EV-n reference used in the latest evaluation' }
        kind: { type: string, enum: [Invoice, Photo, Other] }
        fileName: { type: string }
        contentType: { type: string }
        round: { type: integer }

    Evaluation:
      type: object
      required: [runId, round, status, validation, evidenceFindings, policyReferences]
      properties:
        runId: { type: string, format: uuid }
        round: { type: integer }
        status: { type: string, enum: [Running, Completed, Failed] }
        validation:
          type: array
          items: { $ref: '#/components/schemas/CheckResult' }
        extraction: { type: object, additionalProperties: true, description: 'intake-extraction.schema.json' }
        evidenceFindings:
          type: array
          items: { $ref: '#/components/schemas/EvidenceFinding' }
        policyReferences:
          type: array
          items: { $ref: '#/components/schemas/PolicyReference' }
        policyAssessment: { $ref: '#/components/schemas/PolicyAssessment' }
        risk:
          type: object
          description: Omitted for role claims-agent (FR-005)
          required: [score, level, stage, signals]
          properties:
            score: { type: integer }
            level: { type: string, enum: [Low, Medium, High] }
            stage:
              type: string
              enum: [Intake, Full]
              description: Intake = signals available before evidence analysis (intake short-circuit)
            signals:
              type: array
              items:
                type: object
                required: [code, source, severity, detail]
                properties:
                  code: { type: string, description: 'Risk signal code, e.g. SOURCE_INCONSISTENCY, DUPLICATE_SERIAL_CLAIM' }
                  source: { type: string, enum: [Deterministic, AI] }
                  severity: { type: string, enum: [Low, Medium, High] }
                  detail: { type: string }
        recommendation: { $ref: '#/components/schemas/Recommendation' }
        guardrails:
          type: object
          required: [disposition, reasons]
          properties:
            disposition: { $ref: '#/components/schemas/Disposition' }
            reasons:
              type: array
              items: { type: string }
            checks:
              type: array
              description: Omitted for role claims-agent (FR-005)
              items: { $ref: '#/components/schemas/CheckResult' }
        failureReason: { type: string }

    EvidenceFinding:
      type: object
      required: [evidenceId, kind, result, consistency]
      properties:
        ref: { type: string, description: 'EV-n reference used in the evaluation' }
        evidenceId: { type: string, format: uuid }
        kind: { type: string, enum: [InvoiceExtraction, PhotoAnalysis] }
        result:
          type: [object, 'null']
          additionalProperties: true
          description: 'invoice-extraction.schema.json or photo-analysis.schema.json'
        consistency:
          type: array
          items: { $ref: '#/components/schemas/ConsistencyCheck' }
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: The Evidence agent's confidence (photo analysis only)

    ConsistencyCheck:
      type: object
      required: [field, claimValue, evidenceValue, match]
      description: Deterministic cross-check of one field between the claim and a piece of evidence (FR-016)
      properties:
        field: { type: string }
        claimValue: { type: [string, 'null'] }
        evidenceValue: { type: [string, 'null'] }
        match: { type: boolean }

    PolicyAssessment:
      type: object
      required: [versionOutcome, assessment, model, promptVersion]
      description: The Policy agent's reading, the deterministic policy-version selection outcome and the agent's confidence
      properties:
        versionOutcome: { type: string, enum: [Ok, NoApplicablePolicy, AmbiguousPolicyVersion] }
        assessment:
          type: [object, 'null']
          additionalProperties: true
          description: 'policy-assessment.schema.json'
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: The Policy agent's confidence in its coverage assessment
        model: { type: string }
        promptVersion: { type: string }

    PolicyReference:
      type: object
      required: [ref, clauseKey, clauseType, documentTitle, version, effectiveFrom, effectiveTo, cited]
      properties:
        ref: { type: string }
        clauseKey: { type: string }
        clauseTitle: { type: string }
        clauseType: { type: string, enum: [Coverage, Period, Exclusion, ServiceRule, Definition] }
        documentTitle: { type: string }
        version: { type: integer }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        excerpt: { type: string }
        cited: { type: boolean }

    Recommendation:
      type: object
      required: [isValid, validationErrors, evidenceRefs, policyRefs, missingInformation, model, promptVersion]
      description: >
        An invalid recommendation may lack decision, coverage and confidence. reasoningSummary is
        omitted for role claims-agent (FR-005); empty texts are omitted.
      properties:
        isValid: { type: boolean }
        validationErrors:
          type: array
          items: { type: string }
        decision: { $ref: '#/components/schemas/AiDecision' }
        coverage: { type: string, enum: [COVERED, NOT_COVERED, UNDETERMINED] }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        reasoningSummary: { type: string }
        claimantExplanation: { type: string }
        evidenceRefs:
          type: array
          items:
            type: object
            required: [ref, observation]
            properties:
              ref: { type: string }
              observation: { type: string }
        policyRefs:
          type: array
          items:
            type: object
            required: [ref, relevance]
            properties:
              ref: { type: string }
              relevance: { type: string, enum: [SUPPORTS_COVERAGE, SUPPORTS_REJECTION, DEFINES_PERIOD, CONTEXT] }
        missingInformation:
          type: array
          items: { $ref: '#/components/schemas/RequestedItem' }
        model: { type: string }
        promptVersion: { type: string }

    CheckResult:
      type: object
      required: [code, passed]
      properties:
        code: { type: string }
        stage: { type: string }
        passed: { type: boolean }
        expected: { type: string }
        actual: { type: string }
        message: { type: string }

    ReviewQueueItem:
      type: object
      required: [claimId, reference, productName, escalatedAt, submittedByMe, escalationReasons]
      properties:
        claimId: { type: string, format: uuid }
        reference: { type: string }
        productName: { type: string }
        claimValue: { type: number }
        aiDecision: { $ref: '#/components/schemas/AiDecision' }
        confidence: { type: integer }
        riskLevel: { type: string, enum: [Low, Medium, High] }
        escalatedAt: { type: string, format: date-time }
        submittedByMe:
          type: boolean
          description: The caller submitted this claim and may not decide it (separation of duties)
        escalationReasons:
          type: array
          description: Readable labels of the guardrail reason codes (data-model.md), e.g. "returned after reviewer information request"
          items: { type: string }

    ReviewDecisionRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [Approve, Reject, RequestInformation] }
        justification:
          type: string
          minLength: 10
          maxLength: 2000
          description: Internal, staff-only reason; required when overriding the AI or rejecting (FR-035)
        claimantExplanation:
          type: string
          minLength: 20
          maxLength: 1500
          description: >
            Required for Approve and Reject, not allowed for RequestInformation. Shown to the
            claimant as the outcome explanation; must not contain risk or fraud indicators (FR-036).
            The SPA pre-fills it from the AI's claimantExplanation when the decision matches the AI's.
        requestedItems:
          type: array
          items: { $ref: '#/components/schemas/RequestedItem' }

    ReviewDecision:
      type: object
      required: [id, decision, requestedItems, overridesAi, reviewerName, decidedAt]
      properties:
        id: { type: string, format: uuid }
        decision: { type: string, enum: [Approve, Reject, RequestInformation] }
        justification: { type: string }
        claimantExplanation: { type: string }
        requestedItems:
          type: array
          items: { $ref: '#/components/schemas/RequestedItem' }
        overridesAi:
          type: boolean
          description: True only when the decision differs from a valid APPROVE/REJECT recommendation (FR-035)
        reviewerName: { type: string }
        decidedAt: { type: string, format: date-time }

    DecisionTrace:
      type: object
      required: [claimId, entries, integrity]
      properties:
        claimId: { type: string, format: uuid }
        integrity:
          type: object
          properties:
            hashChainValid: { type: boolean }
        entries:
          type: array
          items: { $ref: '#/components/schemas/TraceEntry' }

    TraceEntry:
      type: object
      required: [seq, occurredAt, step, actor, summary]
      description: aiCalls, toolCalls and ragQueries are omitted when the step made none.
      properties:
        seq: { type: integer }
        occurredAt: { type: string, format: date-time }
        step: { type: string, description: 'e.g. ClaimSubmitted, PolicyRetrieved, AiRecommended, GuardrailsEvaluated, AutoApproved' }
        actor: { type: string }
        summary: { type: string }
        correlationId: { type: string }
        details: { type: object, additionalProperties: true }
        aiCalls:
          type: array
          items: { $ref: '#/components/schemas/AiCallSummary' }
        toolCalls:
          type: array
          items:
            type: object
            required: [agent, tool, allowed, latencyMs]
            properties:
              agent: { type: string }
              tool: { type: string }
              allowed: { type: boolean }
              latencyMs: { type: integer }
              summary: { type: string, description: The stored redacted result or the denial reason }
        ragQueries:
          type: array
          items:
            type: object
            required: [agent, namespaces, filters, resultClauseKeys, latencyMs]
            properties:
              agent: { type: string }
              namespaces:
                type: array
                items: { type: string }
              filters: { type: object, additionalProperties: true }
              resultClauseKeys:
                type: array
                items: { type: string }
              latencyMs: { type: integer }

    AiCallSummary:
      type: object
      required: [agent, route, provider, model, inputTokens, outputTokens, cacheReadTokens, latencyMs, estimatedCost, status, attempt]
      properties:
        agent: { type: string }
        route: { type: string }
        provider: { type: string }
        model: { type: string }
        promptVersion: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        cacheReadTokens: { type: integer }
        latencyMs: { type: integer }
        estimatedCost: { type: number }
        status: { type: string, enum: [Ok, Invalid, Refused, Error, Timeout] }
        attempt: { type: integer }

    PolicyVersionSummary:
      type: object
      required: [policyCode, title, version, effectiveFrom, effectiveTo, regions]
      properties:
        policyCode: { type: string }
        title: { type: string }
        version: { type: integer }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: [string, 'null'], format: date }
        regions:
          type: array
          items: { $ref: '#/components/schemas/Region' }

    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }

    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
