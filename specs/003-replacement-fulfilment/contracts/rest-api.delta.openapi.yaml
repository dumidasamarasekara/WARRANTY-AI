openapi: 3.1.0
info:
  title: Warranty AI Platform API — feature 003 delta (replacement fulfilment)
  version: 0.3.0
  description: |
    New and changed paths and schemas for specs/003-replacement-fulfilment, on top of the 002 delta
    (specs/002-remedy-repair-handover/contracts/rest-api.delta.openapi.yaml). The first 003 API task
    merges it into the canonical contract specs/001-ai-claim-adjudication/contracts/rest-api.openapi.yaml
    (002 research R11). Conventions are unchanged: tenant from the token or the channel host, never
    from a body; another tenant's resources are 404 and recorded as security events; ProblemDetails
    for errors; If-Match carries the ETag of the resource being changed.

    Roles: claims-agent and claims-reviewer may record replacement events; only claims-reviewer may
    record ModelApproved, ModelDeclined and ReturnAccepted; auditor is read-only.

paths:
  /api/claims/{claimId}:
    get:
      summary: CHANGED — claim detail now includes the replacement
      description: >
        Adds ClaimDetail.replacement (ReplacementView) when the claim has one. RemedyView
        (002) accepts the new scenario, table row and pending reason values listed below.

  /api/claims/{claimId}/replacement-locations:
    get:
      tags: [Fulfillment]
      summary: Eligible replacement locations for the claim (FR-008, FR-009)
      description: >
        Any staff role. Active centres of the caller's tenant that issue replacements. Centres
        serving the claim's region and product category come first, ordered by priority then name;
        the first is `suggested`. When none serves them, every active replacement location of the
        tenant is listed with `servesClaim: false`. Same item schema as 002's RepairCentre.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Eligible locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RepairCentre' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/claims/{claimId}/replacement-models:
    get:
      tags: [Fulfillment]
      summary: Models that may be proposed as an equivalent (FR-002, FR-023)
      description: >
        Any staff role. Empty when the policy's productRule is SameModel. Otherwise the tenant's
        other models of the claim's product category whose claim value is at least the claimed
        model's, ordered by claim value then model code.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Proposable models
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ReplacementModel' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/claims/{claimId}/replacement/events:
    post:
      tags: [Fulfillment]
      summary: Record a replacement update (FR-009 – FR-028)
      description: >
        One request records one event; the event type must be allowed from the replacement's
        current status and for the caller's role (data-model.md state machine), otherwise 409 with
        the current status and the allowed event types (403 for a reviewer-only event sent by an
        agent). `reportedAt` must not be in the future or before the step it follows (400).
        ModelApproved, ModelDeclined and ReturnAccepted by a reviewer who submitted the claim get
        403 and a SELF_REVIEW_REFUSED security event. A repeated request carries the old ETag and
        gets 412; UnitReserved queues at most one notification per unit (research R7).
      parameters:
        - $ref: '#/components/parameters/ClaimId'
        - name: If-Match
          in: header
          required: true
          description: ETag of the claim's replacement (ReplacementView.etag)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacementEventRequest' }
      responses:
        '201':
          description: Event recorded; the updated replacement is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplacementView' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/Problem' }

  /api/claims/{claimId}/remedy-completions:
    post:
      summary: CHANGED — accepts Refund only (research R12)
      description: >
        RemedyCompletionRequest.remedy is now `Refund` only. A Replacement completes through the
        HandedToCustomer replacement event (replaces 002 FR-034).

  /api/claims/{claimId}/remedy-decisions:
    post:
      summary: CHANGED — changing away from Replacement cancels the replacement (research R13)
      description: >
        Allowed for a Replacement remedy until the replacement is HandedToCustomer; the
        replacement ends as Cancelled in the same transaction.

  /api/review-queue:
    get:
      summary: CHANGED — new item kind ReplacementCheck
      description: >
        ReviewQueueItem.kind gains ReplacementCheck with `replacementCheckReason`
        (MODEL_APPROVAL or RETURN_MISMATCH). remedyPendingReason gains REPLACEMENT_NOT_AVAILABLE.

  /api/public/claims/{reference}:
    get:
      summary: CHANGED — claimant remedy view covers replacements (FR-032 – FR-034)
      description: >
        ClaimantRemedyView gains `location` and `replacementModelName`, and its steps may carry the
        replacement titles. Never contains notes, serial numbers, return check results, reasons or
        staff names.

components:
  parameters:
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationProblem:
      description: Field validation errors
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Not found in the caller's tenant (also for other tenants' resources)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Not allowed in the current state, or changed concurrently
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ProblemDetails:
      description: As in the canonical contract.
      type: object

    RepairCentre:
      description: As in the 002 delta.
      type: object

    RemedyScenarioAdditions:
      description: Values added to 002's RemedyScenario
      type: string
      enum: [ReplacementNotAvailable]

    RemedyPendingReasonAdditions:
      description: Values added to 002's RemedyView.pendingReason and ReviewQueueItem.remedyPendingReason
      type: string
      enum: [REPLACEMENT_NOT_AVAILABLE]

    RemedyTableRowAdditions:
      description: Values added to 002's RemedyView.tableRow
      type: string
      enum: [replacementNotAvailable]

    ReplacementStatus:
      type: string
      enum: [AwaitingReturn, AwaitingUnit, ReadyForCollection, HandedToCustomer, NotAvailable, Cancelled]

    ReturnState:
      type: string
      enum: [NotYetReturned, Returned, HeldByRepairCentre, Mismatch, Accepted]

    ReplacementEventType:
      type: string
      enum: [LocationChanged, ReturnRecorded, ReturnAccepted, ModelProposed, ModelApproved, ModelDeclined, UnitReserved, UnitRefused, Moved, HandedToCustomer, NotAvailable, Correction]

    ReplacementModel:
      type: object
      required: [productId, modelCode, name, category, claimValue]
      properties:
        productId: { type: string, format: uuid }
        modelCode: { type: string }
        name: { type: string }
        category: { type: string }
        claimValue: { type: number }

    ReplacementView:
      type: object
      required: [status, productRule, returnRule, returnState, allowedEvents, events, etag]
      properties:
        status: { $ref: '#/components/schemas/ReplacementStatus' }
        productRule: { type: string, enum: [SameModel, SameCategoryAtLeastClaimValue] }
        returnRule: { type: string, enum: [AtCollection, BeforeReservation] }
        minimumCoverMonths: { type: integer }
        activeLocation: { $ref: '#/components/schemas/RepairCentre' }
        returnState: { $ref: '#/components/schemas/ReturnState' }
        faultyProductReturn:
          type: object
          properties:
            returnedOn: { type: string, format: date }
            serialSeen: { type: string }
            serialMatches: { type: boolean }
            heldByRepairCentre: { type: boolean }
        pendingProposal:
          type: object
          required: [model, reason, proposedBy, proposedAt]
          properties:
            model: { $ref: '#/components/schemas/ReplacementModel' }
            reason: { type: string }
            proposedBy: { type: string, description: Staff display name }
            proposedAt: { type: string, format: date-time }
        approvedModel: { $ref: '#/components/schemas/ReplacementModel' }
        currentUnit:
          type: object
          required: [seq, modelCode, serialNumber, result]
          properties:
            seq: { type: integer }
            modelCode: { type: string }
            serialNumber: { type: string, description: Staff-only }
            result: { type: string, enum: [Reserved, HandedOver, Refused, Released, Cancelled] }
        allowedEvents:
          type: array
          description: Event types allowed from the current status for the caller's role (drives the staff buttons)
          items: { $ref: '#/components/schemas/ReplacementEventType' }
        events:
          type: array
          items:
            type: object
            required: [seq, type, reportedAt, recordedAt, source, actor]
            properties:
              seq: { type: integer }
              type: { type: string }
              fromStatus: { $ref: '#/components/schemas/ReplacementStatus' }
              toStatus: { $ref: '#/components/schemas/ReplacementStatus' }
              reportedAt: { type: string, format: date-time }
              recordedAt: { type: string, format: date-time }
              source: { type: string }
              actor: { type: string, description: Staff display name, or "system" }
              note: { type: string }
              correctsSeq: { type: integer }
        etag: { type: string }

    ReplacementEventRequest:
      type: object
      required: [type, reportedAt, source]
      additionalProperties: false
      description: >
        Fields by type — LocationChanged and Moved: locationId, reason. ReturnRecorded: returnedOn,
        serialSeen. ReturnAccepted: reason. ModelProposed: productId, reason. ModelApproved: none.
        ModelDeclined: reason. UnitReserved: serialNumber (the model is the claimed or approved
        one). UnitRefused: reason. HandedToCustomer: handedOverOn, returnConfirmed (required true
        under AtCollection unless the product was already returned or held). NotAvailable: reason.
        Correction: correctsSeq, reason and the corrected field (returnedOn, serialSeen,
        serialNumber, handedOverOn or toStatus). `note` is optional for every type.
      properties:
        type: { $ref: '#/components/schemas/ReplacementEventType' }
        reportedAt: { type: string, format: date-time }
        source: { type: string, enum: [Phone, Email, InPerson, Other] }
        note: { type: string, maxLength: 1000 }
        locationId: { type: string, format: uuid }
        reason: { type: string, minLength: 10, maxLength: 1000 }
        returnedOn: { type: string, format: date }
        serialSeen: { type: string, maxLength: 100 }
        productId: { type: string, format: uuid }
        serialNumber: { type: string, maxLength: 100 }
        handedOverOn: { type: string, format: date }
        returnConfirmed: { type: boolean }
        correctsSeq: { type: integer }
        toStatus: { $ref: '#/components/schemas/ReplacementStatus' }

    ClaimDetailReplacementAdditions:
      type: object
      description: Properties added to the canonical ClaimDetail
      properties:
        replacement: { $ref: '#/components/schemas/ReplacementView' }

    ReviewQueueItemReplacementAdditions:
      type: object
      description: Properties added to the canonical ReviewQueueItem (kind gains ReplacementCheck)
      properties:
        replacementCheckReason: { type: string, enum: [MODEL_APPROVAL, RETURN_MISMATCH] }

    ClaimantRemedyViewReplacementAdditions:
      type: object
      description: Properties added to 002's ClaimantRemedyView
      properties:
        location:
          type: object
          description: Present for Replacement once a location is assigned; no contact
          required: [name, address, openingHours]
          properties:
            name: { type: string }
            address: { type: string }
            openingHours: { type: string }
        replacementModelName:
          type: string
          description: Present once a unit is reserved
        replacementSteps:
          type: array
          description: For Replacement, the timeline steps (data-model.md "Claimant projection")
          items:
            type: object
            required: [title, state]
            properties:
              title: { type: string, enum: [Product returned, Ready for collection, Handed to you] }
              state: { type: string, enum: [done, current, upcoming] }
